  # ── 2023-24 rows labeled education_required that the posting text does not support ──
  # Found while checking the claim that almost no 2210 postings carry a hard degree requirement.
  # Two independent readers (a person-checked pass and a blind second pass over the full Education +
  # Qualifications text) agreed on each row below; rows they disagreed on, or that were ambiguous
  # ('or equivalent' with no object, 'Desired Skills' only), were left as education_required.

  - name: reviewed_2023_24_to_education_substitutable
    description: |
      Posting text offers the degree as one path alongside experience ("degree OR experience",
      "bachelor's or equivalent experience", "you must have one of the following", "or 8-10 years related
      experience", "no positive education requirement" with an experience path). The classifier read the degree
      sentence alone.
    match:
