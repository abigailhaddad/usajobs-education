[build]
  command = "echo 'static site'"
  publish = "site"
  # No `ignore` rule: it canceled real builds with "no content change" when a
  # prior errored/canceled deploy had already advanced the cached commit ref.
  # The build is a 2s static publish, so always building is simpler + reliable.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
